  semantic_ac_key: ac_dc74d7aae03a56e9
- description: '예산 초과 시 컷라인: 6번을 통째로 버리지 않고 Issue 동기화만 남긴 채 Pages 뷰를 버린다. Issue만 있어도 확정 기능은 완결되지만, Pages만
