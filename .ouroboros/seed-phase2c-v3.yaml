  17,436위, trash→폐기 55,471위로 상위 5,000 밖). Dice는 배타성을 재지 용어다움을 재지 않기 때문이다. 다만 하나의 EN 용어 안에서는 정확히 작동한다.
- KO 어절은 kiwipiepy로 내용 형태소 어간까지 정규화되어 있다(설치할/설치된/설치한다 → 설치, 서버를 → 서버). 게임 기호 [credit]과 ASCII 괄호구는 자리표 치환으로 보호한다.
  사용자 사전에 없는 도메인 복합어는 과분할된다(연구개발부 → 연구 개발 부). 이 정규화를 되돌리지 않는다.
- 임베딩 모델 교체는 실측 후 기각했다. bge-m3는 dense 단독 0.4249→0.4162, BM25+dense 0.4250→0.4060으로 개선되지만 실제 출하 구성인 BM25+dense+char
  융합에서는 0.3850→0.3858로 오히려 나빠지고 인코딩이 14배 느리다. MiniLM-L6-v2를 유지한다. 같은 실험을 반복하지 않는다.
- TM 하이브리드 전체(BM25+dense+char+RRF)가 difflib 자명 기준선과 동률 0.3850이고 char TF-IDF 단독(0.3925)이 BM25+dense 조합 전부보다 낫다. 즉
  검색 병목은 임베딩 모델이 아니라 융합 설계다. 이 페이즈에서 재설계하지는 않되, AC의 TM 유사도 임계를 특정 상수로 고정하지 않는다.
- 측정에서 유도된 수치를 수용 기준에 상수로 박지 않는다. 관계로 쓰고 값은 실행 시점에 측정한다. phase1의 종료 게이트가 '중앙값 0.359 근방'이라는 상수를 넣었다가 무효가 됐다 — 0.359는
  legacy pack/ 레이아웃의 다른 카드 집합에서 나온 값이고 v2 split의 실측 천장은 0.385다. 하드 게이트 3의 임계도 상수가 아니라 'TM-only 베이스라인 x 0.7'로 유도한다.
  이 원칙은 게이트 임계뿐 아니라 HITL 발화 임계에도 동일하게 적용된다.
- LLM 판정 배치는 청크 단위로 돌리고 청크마다 judgments.jsonl에 체크포인트를 적으며 프롬프트 지문을 함께 기록한다. 프롬프트가 바뀌면 지문이 달라져 낡은 판정이 자동 무효가 된다. 재시도
