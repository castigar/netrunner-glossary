goal: '[페이즈 2c/3 · 온라인 파이프라인 본체] Android: Netrunner EN→KO 번역 보조 에이전트의 2단계 온라인 실행 경로를 실제로 배선하고, 그 배선이 존재한다는 것을 재현
  가능한 증거로 증명한다. 저장소에는 가드레일 5종·저장소·MCP 도구·게이트 채점기가 라이브러리로 존재하지만 그것들을 잇는 그래프가 없어 아무도 호출하지 않는다. 이 페이즈의 범위는 (1) 카드의
  text/flavor 각 필드를 rule/flavor 경로로 라우팅해 TM 검색과 용어집 주입으로 필드 단위 DraftRecord를 생성하고, (2) 그 레코드의 명시된 투영을 기존 가드레일에 넘겨
  검증하며, (3) 위반·신규용어·저신뢰 건을 LangGraph interrupt()로 사람에게 넘기고 승인 결과를 approved.jsonl과 new_term_candidates.json에 적재하는
  왕복을 완성하고, (4) 필드 단위 예측을 카드 단위로 합성해 하드 게이트 3개와 관찰 지표에 통과시켜 판정을 보고하는 진입점까지다. 기존 모듈을 다시 만들지 않는다. 3단계 확정 절차(GitHub
  Issue 동기화·Pages)는 범위가 아니다. 단일 진실 원천은 mini_pjt/SERVICE.md다.'
