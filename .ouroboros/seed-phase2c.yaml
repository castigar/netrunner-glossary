  semantic_ac_key: ac_423a07639221de5c
- description: TM 검색(tm_index.HybridTMIndex.search)과 용어집 주입(assets/glossary.json)으로 초벌 번역을 생성한다. 카드 텍스트는
    injection_guard.safe_wrap으로 감싼 뒤 프롬프트에 넣는다 — 카드 내용을 지시로 해석하지 않는다.
  semantic_ac_key: ac_cec11c14d8741c33
- description: 생성된 초벌을 기존 가드레일 5종(glossary_guard, new_term_guard, fidelity_guard, injection_guard, conflict_guard)으로
    검증한다. 가드를 새로 만들지 않고 호출한다. 검증 실패 건은 승인 저장소로 가지 않고 검토 큐로 간다.
  semantic_ac_key: ac_c7f287efa636b697
- description: HITL을 LangGraph interrupt()로 실제 호출한다. hitl_interrupt.check_hitl_triggers가 정의한 네 트리거(신규
    EN 용어, 용어 충돌, 규칙 검증 실패, TM 최고 유사도 임계 미만)가 그래프 노드에서 발화해 실행이 사람 입력을 기다리며 멈춘다. docstring 언급이 아니라 실제 호출부가
    있어야 한다.
  semantic_ac_key: ac_435394fbeab16b8a
- description: 사람이 승인하거나 수정 후 승인하면 그래프가 재개되어 approved_store.append_approved로 approved.jsonl에 적재하고, 초벌에
    포함된 신규 용어는 append_new_term_candidate로 new_term_candidates.json에만 적재한다. 승인만으로 glossary.json이 갱신되지 않으며
    다음 카드부터 강제되지도 않는다.
  semantic_ac_key: ac_ac24d16545ec0b61
- description: 파이프라인 출력을 hold-out 100장에 대해 하드 게이트 3개와 관찰 지표에 통과시켜 판정을 보고하는 진입점을 제공한다. gate_verdict.combine과
    obs_llm_judge를 호출해 합격/불합격과 실측 수치를 출력한다.
  semantic_ac_key: ac_c6dc5021d0bae612
