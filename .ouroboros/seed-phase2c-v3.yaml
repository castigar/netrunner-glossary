  환경변수에서 읽고 값을 코드·로그·커밋에 기록하지 않는다. 모델 id는 반드시 availableModelsOnBedrock.md의 가용 목록에서만 고른다. 그 목록에 없는 id는 호출되지 않는다 —
  특히 us.anthropic.* 접두 id는 이 계정에 없으므로 run_pipeline.py docstring의 예시를 그대로 따라 쓰지 않는다. 다만 us.amazon.* 접두는 목록에 실재하므로
  금지 대상이 아니다.
- langgraph가 의존성에 없으므로 추가한다. interrupt()는 langgraph의 것을 쓴다.
- 평가 데이터를 수정해서 게이트를 통과시키지 않는다. data/hold_out.json과 data/train.json의 카드 집합과 분할은 고정이며, 게이트가 통과하도록 정답 번역이나 임계값을 바꾸는
  것은 금지한다. 채점 결과가 나쁘면 그것이 측정 결과다.
- '테스트는 구현을 그대로 반복하는 동어반복이 아니어야 한다. if rate >= THRESHOLD: assert passed is True else: assert passed is False 형태는
  구현 정의상 항상 참이므로 검증이 아니다. 실패할 수 있는 기대값을 단언한다.'
- 가드레일·저장소·게이트를 새로 구현하지 않는다. 이미 있는 것을 import해 호출한다. 중복 구현은 사양 위반이다. 다만 기존 채점기·가드에 선택 인자를 추가해 predictions나 DraftRecord
  투영을 받게 하는 확장은 배선에 속하며 허용된다.
- 구현 순서는 페이즈 분할로 고정돼 있다. 이 페이즈의 범위 밖 기능(3단계 Issue 동기화·Pages)을 앞당겨 구현하지 않는다.
- 예측·판정의 기본 단위는 카드가 아니라 (카드 id, 필드) 쌍이다. 한 카드는 text와 flavor를 동시에 가질 수 있으므로 최대 2개의 DraftRecord를 낳으며, 카드 단위 판정은 그
  필드 결과를 명시된 규칙으로 합성해 얻는다. 카드 1장 = 초벌 1개를 전제하는 코드를 쓰지 않는다.
- 이전 세대의 PASS를 증거 없이 승계하지 않는다. AC를 동결하려면 (a) 그 AC의 입력 스키마가 세대 사이에 변하지 않았고 (b) 호출부의 실재를 확인하는 재현 가능한 검증 명령이 이번 세대에도
  통과해야 한다. verification_status=assumed는 PASS의 근거가 아니다. Gen 2에서 draft_record 도입으로 초벌의 정체가 문자열에서 레코드로 바뀐 이상, 초벌을 입력으로
  받는 AC는 모두 재검증 대상이다.
- 초벌 품질과 게이트 수치는 반드시 실제 Bedrock 모델 실행으로 측정한다. run_pipeline.py의 _StubLLM은 프롬프트에서 TM 상위 1건의 KO를 정규식으로 꺼내 그대로 돌려주므로,
  스텁 실행의 출력은 TM 복사본이고 그것을 채점한 수치는 무의미하다 — pipeline_output.jsonl 165건이 TM 상위 1건과 바이트 단위로 동일함이 실측으로 확인됐다. 스텁은 배선 테스트
  전용이며, AC6의 게이트 판정과 AC2의 초벌 품질 주장은 스텁 실행을 근거로 삼지 않는다. 실행 모델은 global.anthropic.claude-haiku-4-5-20251001-v1:0을 쓰고
  자격증명은 상위 경로의 .env에서 읽으며 값을 코드·로그·커밋에 기록하지 않는다. 이 repo는 public이다.
- '신규 용어 판정은 차단형과 기록형으로 나눈다. 차단형만 HITL interrupt를 발화시키고 기록형은 파이프라인을 통과시킨다. 차단형의 정의는 (a) 카드의 en_keywords(부제) 중 용어집
  미등재 항목, (b) 룰 텍스트에서 문장 첫 단어가 아닌 위치에 대문자로 시작하는 미등재 토큰 — 룰 텍스트가 참조하는 카드 이름·고유명사다. 그 외 미등재 토큰은 전부 기록형이며 new_term_candidates.json에
  즉시 적재하고 초벌 레코드에도 남긴다. 승인 시점이 아니라 탐지 시점에 적재한다. 마크업 태그명(strong, em, trace 등)은 원문의 단어가 아니므로 어느 쪽 후보도 아니다 — 토크나이저가
  <strong>에서 strong을 뽑는 것은 결함이며 태그를 먼저 제거해 고친다. 판정은 new_term_guard가 아니라 hitl_interrupt가 한다 — 가드는 탐지해 분류만 하고 차단 여부는
  코디네이터 한 곳에서 정한다. 근거는 hold_out 100장 실측이다: 현행 정의는 카드의 98%를 차단해 approved.jsonl이 한 번도 생기지 않았고 AC5·AC8이 실행 증거를 갖지 못했다.
  불용어 목록을 늘리는 방향은 효과가 없다 — 마크업 제거와 굴절 정규화를 더해도 필드 발화가 92.7%에서 83.6%로만 내려가고 cannot·game· equal·worth 같은 일반 영단어가 계속
  남는다. 위 차단형 정의는 카드 발화를 21%로 낮춘다.'
- 이 세대의 AC는 8개로 고정한다. 새 AC를 추가하지 않는다. 다만 이것은 개수 동결이며 문언 동결이 아니다 — 기존 AC의 문언을 고치는 것은 허용되고 이 세대는 AC4와 AC6의 문언을 실제로
  고쳤다. Gen 3가 스스로 추가한 AC7(필드→카드 합성)과 AC8(eval_autoresume)은 범위 안으로 판정해 유지하지만, AC9(검증 명령 ↔ AC 대응표와 세대 간 PASS 승계 조건)은
  제품에 아무것도 더하지 않는 프로세스 AC이므로 범위 밖으로 판정해 제거했다. 같은 성격의 AC를 다시 만들지 않는다.
- '이 세대가 물려받은 알려진 결함 3건은 PASS로 승계하지 않고 이번 세대에서 해소한다. (1) AC3 — 검토 큐 레코드가 어느 가드·트리거가 왜 실패했는지를 보존해야 하는데 _state_to_draft_record는
  interrupted: true 하나만 남긴다. (2) AC8 — 생산자 측 부재(위 AC8 문언 참조). (3) Gen 3의 자기 보고 901 passed와 실측 848의 차이 53은 AC8·AC9
  산출물이 커밋되지 않고 워크트리와 함께 사라진 분량이다. 체크포인트 커밋은 원자적이지 않으므로, AC 단위로 커밋할 때 그 AC가 건드린 파일 전부가 커밋에 들어갔는지 git log <범위> --
  <파일>로 확인한다.'
- 합격을 선언하기 전에 프로젝트 의존성으로 pytest를 실제로 돌려 실측한다. 자기 보고를 근거로 삼지 않는다. 다만 Seed가 인터프리터 절대경로를 지정하지 않는다 — 테스트 명령은 .ouroboros/mechanical.toml이
  소유하고, ouroboros의 명령 검증기가 절대경로 실행파일을 거부하므로 절대경로를 적은 제약은 인코딩되지 않고 조용히 드롭된다. 실행 전 CORPUS_ROOT가 설정돼 있어야 하며 미설정 시 즉시
  실패한다.
- 스텁 실행은 탐지 대상이 아니라 발생 불가여야 한다. 진입구가 세 곳이므로 전부 막는다. (a) run_pipeline.run_pipeline()의 llm_model 기본값 None을 제거한다 —
  argparse만 required로 바꾸면 함수 직접 호출 경로가 열려 있다. (b) evaluate_pipeline의 별도 --llm-model도 기본값이 None이므로 같이 막는다. (c) --pipeline-output이
  임의의 jsonl을 받아 채점하는 경로를 막는다 — 저장소에 Gen 4의 스텁 시대 pipeline_output.jsonl이 남아 있어 플래그 없이 같은 결과가 재현된다. 스텁은 배선 테스트 전용이며
  명시적 플래그로만 진입할 수 있다.
- run_pipeline이 DraftRecord를 직렬화할 때 tm_hits에서 ko_text를 버리지 않는다. 현재 구현은 {id, en_text, score}만 남겨 산출물만으로 에코율을 계산할
  수 없는데, 온톨로지의 draft_record는 이미 tm_hits가 id·en_text·ko_text·score를 갖는다고 규정하고 있다. 즉 이것은 새 요구가 아니라 Seed 위반의 복구이며,
  복원하면 에코 게이트가 pipeline_output.jsonl 하나로 자족한다.
- 임계는 두 종류로 나뉜다. 측정 배경이 없는 순수 정책 비율은 리터럴 상수로 둔다(gate1 0.95, gate2 1.0이 그 예다). 측정된 수가 뒤에 있는 임계는 반드시 관계로 쓰고 값은 실행
  시점에 측정한다(gate3가 THRESHOLD_FACTOR만 고정하고 THRESHOLD = baseline x factor로 유도하는 것이 그 예다). TM 에코 게이트의 임계는 후자에 속한다 —
  정당한 우연일치율이 코퍼스와 split에 의존하기 때문이다. hold_out 실측으로 100장 중 1장(1.0%)이 TM 최상위 KO와 자기 정답 KO가 바이트 동일했다.
- TM 에코 게이트의 세는 규칙을 고정한다. 비교 피연산자는 레코드 전체가 아니라 draft_ko와 그 레코드 자신의 tm_hits[0].ko_text다. 분모는 tm_hits가 1건 이상이고 draft_ko가
  비어 있지 않은 레코드 전체이며, interrupted 여부는 분모에 영향을 주지 않는다 — 실측상 초벌 생성이 가드 검사보다 먼저이므로 중단된 레코드도 초벌을 갖는다(스텁 실행 165건 중 164건이
  중단이었으나 빈 초벌은 0건). 비교는 저장소의 다른 모든 비교와 동일한 공백 정규화를 거친 뒤 수행한다. 분모 n과 실측 비율을 산출물에 기록한다. TM 히트 커버리지 하한은 두지 않는다 — 검색기가
  구조상 항상 상위 k건을 돌려주어 커버리지가 항상 100%이므로 판정에 쓰면 영원히 통과하는 장식이 된다. 수치는 기록만 한다.
- TM 에코 게이트는 적대적 방어 장치가 아니라 프롬프트·검색 회귀 카나리아다. 문자 하나로 회피되며 실모델의 rule 경로 유사도 p90이 이미 0.90이다. 스텁 방어는 위 진입구 봉쇄가 담당하고
  이 게이트는 정직한 퇴행을 잡는다. 문서에 그렇게 적는다.
- 이 세대의 합격 판정은 ralph 내부 evolve_step의 score를 근거로 삼지 않는다. 그 경로의 spec_verifier는 소스 정규식 스캐너이고 행위·주관 assertion을 코드 실행
  없이 SKIPPED로 떨어뜨리며, 한 AC에서 SKIPPED가 하나라도 섞이면 그 AC는 NOT_EVALUATED가 되어 점수상 FAIL과 동일하게 처리된다. Gen 4는 AC 8개 전부가 이 상태여서
  score 0.0이 코드 작성 전에 확정돼 있었다. 판정은 (1) 프로젝트 pytest 실측, (2) TM 에코율 실측, (3) 워크트리에 별도로 돌린 ouroboros_evaluate(formal_evaluation
  경로)로 한다. 이 사실 때문에 AC 문언을 정규식 스캐너가 좋아하는 형태로 깎지 않는다.
- 실제 모델 실행이 쓰로틀링(ThrottlingException)·용량 부족·모델 미가용으로 실패하면 availableModelsOnBedrock.md의 다른 가용 모델로 재시도한다. 폴백 순서는 목록
  기재 순서를 따르고, 1순위 global.anthropic.claude-haiku-4-5-20251001-v1:0이 실패하면 us.amazon.nova-pro-v1:0 → us.amazon.nova-2-lite-v1:0
  → global.amazon.nova-2-lite-v1:0 → us.amazon.nova-lite-v1:0 순으로 내려간다. 재시도 전에 지수 백오프를 적용하고, 같은 모델에 대한 재시도 횟수와 대기
  시간을 산출물에 기록한다. 폴백에는 세 가지 금지가 붙는다. (a) 목록 밖 모델로 폴백하지 않는다. (b) 어떤 경우에도 _StubLLM으로 폴백하지 않는다 — 스텁은 배선 테스트 전용이며 폴백
  경로가 아니다. 목록의 모델이 전부 실패하면 빈 예측을 남기고 그 원인을 보고하되 스텁 출력으로 채우지 않는다. (c) 폴백 사실을 숨기지 않는다 — 실행 산출물의 헤더에 시도한 모델 id와 각각의
  성공·실패 사유를 남기고, 각 DraftRecord에는 그 레코드를 실제로 생성한 모델 id를 기록한다.
- 한 실행에서 둘 이상의 모델이 쓰였으면 그 실행은 혼합 실행이며 보고가 그것을 명시한다. 모델별 레코드 수와 모델별 게이트 수치를 함께 낸다 — Haiku와 Nova는 계열이 다르므로 혼합 실행의
  단일 평균은 어느 모델의 품질도 대표하지 않는다. TM 에코율과 하드 게이트 판정은 혼합 실행에서도 전체 기준으로 내되, 모델별 내역을 함께 보고해 품질 변화가 모델 교체 때문인지 코드 변경 때문인지
  구분할 수 있게 한다.
- TM 에코 게이트의 ECHO_FLOOR는 0.05(5%)로 고정한다. 이것은 측정에서 유도한 수가 아니라 정책 하한이며, gate1의 0.95·gate2의 1.0과 같은 성격이다 — 따라서 '측정값을
  상수로 박지 않는다'는 원칙에 어긋나지 않는다. 관계식의 나머지 항(정당한 우연일치율)은 여전히 measured_in_run이다. 근거는 기계적 분리이지 표본 적합이 아니다 — 스텁 실행은 구현상
  100%가 필연이고(프롬프트에서 TM 상위 1건 KO를 정규식으로 꺼내 그대로 돌려주므로), 자유 생성 모델은 문장부호·공백까지 일치할 확률이 사실상 0이며(실측 0/17), 정당한 우연일치는 hold_out
  실측 1.0%다. 0.05는 그 1.0%에 5배 여유를 둔 값이다. 17건짜리 실행의 0/17에 맞춰 고른 값이 아니다 — phase1의 0.359가 죽은 방식을 반복하지 않는다. 코드에서는 gate3의
  THRESHOLD_FACTOR와 같은 위상의 명명된 모듈 상수로 두고, 리터럴을 판정부에 흩뿌리지 않는다.
acceptance_criteria:
- description: 라우팅의 입력 단위는 카드가 아니라 (카드 id, 필드) 쌍이다. 카드의 text가 비어 있지 않으면 rule 경로로, flavor가 비어 있지 않으면 flavor 경로로 각각
    라우팅하며, 두 필드를 모두 가진 카드는 두 번 라우팅되어 route가 서로 다른 2개의 DraftRecord를 낳는다. 라우팅은 에이전트 분할이 아니라 LangGraph 조건부 엣지(그래프 분기)로
    구현하며 Supervisor 패턴과 Plan-Execute는 채택하지 않는다. 검증 증거는 docstring이 아니라 실행 가능한 테스트다 — text만 있는 카드, flavor만 있는 카드,
    둘 다 있는 카드 각각에 대해 생성된 DraftRecord의 개수와 route 값을 단언한다.
  semantic_ac_key: ac_0938382881767ec8
- description: 각 (카드 id, 필드) 쌍에 대해 TM 검색(tm_index.HybridTMIndex.search)과 용어집 주입(assets/glossary.json)으로 초벌을 생성하고
    DraftRecord로 반환한다. injection_guard.safe_wrap은 번역 대상 카드 텍스트뿐 아니라 TM 히트로 되돌아온 유사 카드의 en_text·ko_text에도 적용한다 —
    코퍼스 유래라는 사실은 신뢰의 근거가 아니다. glossary.json의 llm_judged가 false이면 그 사실을 초벌 프롬프트 본문과 DraftRecord.glossary_llm_judged
    두 곳 모두에 드러낸다. 증거는 주장이 아니라 산출물이다 — hold_out 표본에 대해 파이프라인을 실제로 실행해 DraftRecord를 직렬화한 파일을 남기고, safe_wrap 경계 문자열이
    프롬프트에 실재함을 단언하는 테스트를 포함한다.
  semantic_ac_key: ac_f55753a57d2e8d71
- description: 생성된 DraftRecord를 기존 가드레일 5종(glossary_guard, new_term_guard, fidelity_guard, injection_guard, conflict_guard)으로
    검증한다. 가드를 새로 만들지 않고 import해 호출하되, 각 가드가 레코드의 어느 투영을 받는지 코드에 단일 어댑터로 명시한다 — fidelity_guard와 injection_guard는
    (en_source, draft_ko), glossary_guard는 (draft_ko, injected_terms), new_term_guard는 (en_source, draft_ko, glossary),
    conflict_guard는 (draft_ko, injected_terms, conflicts)를 받는다. 기존 시그니처가 문자열만 받는 경우 선택 인자 추가로 확장하며 재구현하지 않는다. 검증
    실패 건은 approved_store로 가지 않고 검토 큐 레코드로 이동하며, 그 레코드는 어느 가드가 왜 실패했는지를 보존한다. 테스트는 고의로 위반하는 초벌을 넣어 검토 큐 적재와 승인 저장소
    미적재를 동시에 단언한다.
  semantic_ac_key: ac_aacb78b49235b3ff
- description: HITL을 LangGraph interrupt()로 실제 호출한다. hitl_interrupt.check_hitl_triggers가 트리거를 판정하되, interrupt를 발화시키는
    것은 차단형 신규 용어와 용어 충돌·규칙 검증 실패·TM 최고 유사도 임계 미만이다. 차단형 신규 용어는 둘뿐이다 — (a) 카드 en_keywords(부제) 중 용어집 미등재 항목, (b) 룰
    텍스트에서 문장 첫 단어가 아닌 위치에 대문자로 시작하는 미등재 토큰. 그 외 미등재 토큰은 전부 기록형이며 탐지 시점에 new_term_candidates.json에 적재하고 초벌 레코드에도
    남기되 파이프라인을 멈추지 않는다. 마크업 태그명(strong·em·trace 등)은 원문의 단어가 아니므로 어느 쪽 후보도 아니다 — 토크나이저가 태그에서 태그명을 뽑는 것은 결함이며 태그를
    먼저 제거해 고친다. 분류는 new_term_guard가 하고 차단 여부 판정은 hitl_interrupt가 한다. docstring 언급이 아니라 실제 호출부가 있어야 하며, 검증은 두 방향
    모두로 한다 — 차단형 토큰을 가진 카드가 __interrupt__ 상태에 도달함을 단언하는 테스트와, 기록형 토큰만 가진 카드가 멈추지 않고 통과하며 그 토큰이 new_term_candidates.json에
    적재됨을 단언하는 테스트. 네 번째 트리거의 임계는 상수가 아니라 같은 실행 안에서 측정한 tm_confidence 분포의 상대 위치로 유도하고, 유도된 실측값과 유도 규칙을 실행 산출물에 기록한다.
    임계 유도에 hold_out의 정답 ko_text를 사용하지 않는다.
  semantic_ac_key: ac_8f900bc33b62bea3
- description: 사람이 승인하거나 수정 후 승인하면 그래프가 Command(resume=...)로 재개되어 approved_store.append_approved로 approved.jsonl에
    적재한다. 적재 단위는 (카드 id, 필드) 쌍이며 route를 함께 기록한다. '초벌에 포함된 신규 용어'의 정의를 고정한다 — new_term_guard가 EN 원문에서 찾아낸 용어집 미등재
    EN 용어와, 그 용어에 대해 초벌 KO가 사용한 역어의 쌍이다. DraftRecord에 이 쌍을 담는 new_terms 필드를 두고, append_new_term_candidate로 new_term_candidates.json에만
    적재한다. 승인만으로 glossary.json은 갱신되지 않으며 다음 카드부터 강제되지도 않는다 — 승인 직후 같은 용어를 포함한 카드를 처리해 glossary.json의 해시가 불변이고 주입
    용어 목록에도 추가되지 않았음을 단언하는 테스트로 증명한다.
  semantic_ac_key: ac_50a6db0b67093b0a
- description: data/hold_out.json 전량(장수는 파일의 레코드 수에서 유도한다)에 대해 파이프라인을 실행하고 하드 게이트 3개와 관찰 지표로 판정을 보고하는 진입점을 제공한다.
    같은 실행 안에 서로 다른 두 예측 계열이 존재함을 이름으로 구분한다 — pipeline_predictions(전체 파이프라인 출력)와 tm_only_baseline(TM 검색만의 출력). 게이트
    1·2·3은 pipeline_predictions를 채점 대상으로 받으며, gate1_term_compliance와 gate2_symbol_preservation이 hold_out의 ko_text를
    읽는 현재 상태는 predictions 선택 인자를 추가하는 확장으로 해결한다(재구현 금지 제약은 확장을 금지하지 않는다). 게이트 3의 임계는 같은 실행에서 산출한 tm_only_baseline
    x 0.7로 유도하고 그 베이스라인 수치도 출력한다. 집계는 3단이다 — 필드별 준수/위반 → 카드별 준수/위반 → 게이트별 비율과 합격/불합격 → gate_verdict.combine의 단일
    최종 판정. 보고에는 게이트별 실측 수치, 최종 합격/불합격, TM 베이스라인, glossary의 llm_judged 상태, 그리고 빈 예측의 원인별 건수(TM 검색 실패 / 가드 실패로 검토
    큐 잔류 / 승인 미완)를 각각 포함한다. 어떤 경우에도 hold_out의 ko_text를 예측으로 되돌려 넣지 않는다. 이 진입점의 게이트 수치는 반드시 실제 Bedrock 모델 실행으로 산출한다
    — _StubLLM 실행의 출력은 TM 복사본이므로 그것을 채점한 수치는 무효다. 실행 산출물의 헤더에 실행 모드(real|stub)와 모델 id를 기록하고, 모드가 real이 아니면 게이트 판정을
    내지 않는다. 추가로 TM 에코 게이트를 둔다 — pipeline_predictions 중 draft_ko가 자신의 tm_hits[0].ko_text와 같은 레코드의 비율이 max(ECHO_FLOOR,
    같은 실행에서 측정한 정당한 우연일치율)을 넘으면 불합격이다. ECHO_FLOOR는 0.05로 고정하고 우연일치율은 measured_in_run으로 산출하며, 두 값과 유도된 임계와 분모 n과
    실측 비율을 함께 보고한다. 세는 규칙은 제약이 고정한 것을 따른다. 실제 모델 실행이 쓰로틀링·용량 부족·미가용으로 실패하면 availableModelsOnBedrock.md의 다른 가용 모델로
    폴백해 재시도하며, 스텁으로는 폴백하지 않는다. 폴백이 일어난 실행도 '실제 모델 실행'으로 인정하되, 헤더에 시도한 모델 id와 실패 사유를, 각 레코드에 그 레코드를 생성한 모델 id를 남기고,
    둘 이상의 모델이 쓰였으면 모델별 레코드 수와 모델별 게이트 수치를 함께 보고한다. 가용 목록의 모델이 전부 실패하면 빈 예측으로 두고 원인을 보고한다 — 이때 empty_prediction_cause에
    모델 실행 실패가 원인으로 구분되어야 하며, 어떤 경우에도 스텁 출력이나 hold_out의 ko_text로 채우지 않는다.
  semantic_ac_key: ac_585e900a790c935c
- description: 필드 단위 결과를 카드 단위 판정으로 합성하는 규칙을 코드와 보고에 명시한다 — 한 카드의 모든 필드 예측이 준수일 때만 그 카드를 준수로 세고, 한 필드라도 위반이면 카드
    위반으로 센다. 빈 예측(TM 실패·검토 큐 잔류·승인 미완)을 가진 필드는 준수로 세지 않으며, 게이트별 분모에서 조용히 제외하지도 않고 원인별로 따로 집계해 보고한다. 필드가 하나뿐인 카드와
    둘인 카드가 동일한 규칙으로 처리됨을 서로 다른 기대값으로 단언하는 테스트를 포함한다.
  semantic_ac_key: ac_9f10ad67003c2a32
- description: 평가 실행에서 HITL이 어떤 상태로 존재하는지를 실행 모드로 명시한다. 평가 진입점은 interrupt를 우회하지 않고 실제로 발화시킨 뒤, 사람 대신 결정론적 자동 응답자가
    재개 값을 공급하는 eval_autoresume 모드로 동작한다. 자동 응답자는 정답 ko_text를 열람하지 않으며 승인/거부 정책이 결정론적이고 재현 가능해야 한다. 보고는 해당 실행의 예측이
    사람 승인을 거치지 않은 산출물임과 트리거 발화 건수·자동 승인 건수·자동 보류 건수를 명시한다. 운영 모드에서는 같은 그래프가 실제 interrupt에서 정지함을 별도 테스트로 단언한다. 이
    AC는 현재 절반만 구현돼 있다 — evaluate_pipeline.py는 eval_autoresume_header를 읽을 줄 알지만 그것을 생산하는 run_pipeline 측이 없다(소비자만
    있고 생산자가 없다). Gen 3가 만들었다고 보고한 tests/test_ac8_eval_autoresume.py는 git 이력에도 디스크에도 없다. 이 세대는 생산자 측과 그 테스트를 복구하는
    것을 이 AC의 범위에 포함한다.
  semantic_ac_key: ac_b79ae440bae0a5eb
ontology_schema:
  name: SessionSettledContract
  description: Requirements the session already settled, crystallized without an interview. Every entry is verbatim
    host-supplied material — no LLM composed any part of this Seed.
  fields:
  - name: draft_record
    type: object
    description: 초벌 생성의 산출 단위이며 단위는 (카드 id, 필드) 쌍이다. card_id, field(text|flavor), draft_ko(문자열), route(rule|flavor),
      en_source(safe_wrap 이전 원문), tm_hits(id·en_text·ko_text·score의 목록), tm_confidence(top-1 점수), injected_terms(주입된
      용어집 항목 목록), new_terms(new_term_identity 쌍의 목록), glossary_llm_judged(bool)를 필드로 갖는다. 초벌은 문자열이 아니라 근거를 지닌 레코드이며,
      이 레코드를 소비하는 모든 지점은 guard_input_projection이 정한 투영으로만 접근한다.
    required: true
  - name: route_semantics
    type: enum
    description: 'rule | flavor. route는 카드가 아니라 필드에 붙는다 — text 필드는 rule, flavor 필드는 flavor 경로다. 두 경로는 같은 DraftRecord
      스키마를 산출하되 의미가 다르다: rule 경로의 TM 히트는 용어·구문 일치 근거이고 용어집을 주입하며, flavor 경로의 TM 히트는 문체 유사 참조이고 용어집 주입은 룰 용어가 실제로
      등장할 때로 제한된다.'
    required: true
  - name: untrusted_text_boundary
    type: list[string]
    description: safe_wrap을 적용해야 하는 신뢰 불가 입력의 목록. 번역 대상 카드 텍스트와 HybridTMIndex.search가 되돌려준 유사 카드의 en_text·ko_text를
      모두 포함한다. 코퍼스 유래라는 사실은 신뢰의 근거가 아니다.
    required: true
  - name: unjudged_glossary_disclosure_sites
    type: list[string]
    description: glossary.json의 llm_judged가 false일 때 그 사실을 드러내야 하는 지점. 초벌 프롬프트 본문, DraftRecord.glossary_llm_judged,
      평가 진입점의 출력 보고 세 곳이다. 한 곳에만 표시하는 것은 불충분하다.
    required: true
  - name: gate_scoring_subject
    type: enum
    description: pipeline_predictions | tm_only_baseline. 같은 실행 안에 두 개의 예측 계열이 공존하며 이름으로 구분된다. 하드 게이트 1·2·3의 채점
      대상은 항상 pipeline_predictions이고, 게이트 3의 임계를 유도하기 위한 베이스라인 산출만이 tm_only_baseline을 채점한다. 두 계열 모두 hold_out의 ko_text(정답
      코퍼스)를 채점 대상으로 삼지 않는다 — ko_text는 오직 참조 정답이다.
    required: true
  - name: verdict_aggregation_unit
    type: string
    description: 판정의 단위. 카드별 준수/위반 → 게이트별 비율 → 게이트별 합격/불합격 → gate_verdict.combine의 단일 최종 판정. 진입점은 이 3단 집계를 그대로 호출
      형태로 구현한다.
    required: true
  - name: baseline_provenance
    type: enum
    description: measured_in_run | loaded_from_previous. 하드 게이트 3의 임계를 유도하는 TM-only 베이스라인의 출처이며 값은 measured_in_run으로
      고정한다. 진입점이 매 실행마다 산출해 관찰 지표로 함께 출력한다.
    required: true
  - name: hold_out_size_source
    type: string
    description: 평가 대상 장수의 출처. data/hold_out.json의 레코드 수에서 유도하며 코드나 AC에 100 같은 상수로 박지 않는다. 분할은 고정이므로 파일이 곧 정의다.
    required: true
  - name: wiring_vs_reimplementation
    type: string
    description: 금지되는 것은 채점 로직·가드·저장소의 재구현이며, 기존 함수를 import해 호출하고 predictions나 DraftRecord 투영을 받도록 선택 인자를 추가하는 확장은
      배선에 속해 허용된다. 반대로 '한 번의 호출만큼 떨어져 있는' 미호출 상태는 배선 미완이다. 이 판정의 증거는 호출부의 실재를 확인하는 실행 가능한 명령이며, 소스 검증을 건너뛴 assumed
      상태로는 이 필드의 충족을 주장할 수 없다.
    required: true
  - name: prediction_fallback_policy
    type: string
    description: 예측이 비는 모든 경우의 처리 규칙. empty_prediction_cause의 세 원인 각각에 대해 예측을 빈 값으로 두고 원인별 건수를 보고하며, hold_out의 ko_text를
      대신 채우지 않는다. 정답을 예측으로 되돌려 넣는 것은 게이트 수치를 왜곡한다.
    required: true
  - name: prediction_unit
    type: string
    description: 예측과 초벌의 기본 단위는 (카드 id, 필드) 쌍이며 필드는 text|flavor다. 한 카드는 최대 2개의 DraftRecord를 낳는다. 카드 단위 판정은 그 카드의
      모든 필드 예측이 준수일 때만 준수이고, 한 필드라도 위반이거나 빈 예측이면 카드 위반으로 센다. 카드 1장=초벌 1개를 전제하는 코드는 이 필드를 위반한다.
    required: true
  - name: guard_input_projection
    type: object
    description: 각 가드레일이 DraftRecord의 어느 투영을 받는지의 고정 사상. fidelity_guard·injection_guard는 (en_source, draft_ko),
      glossary_guard는 (draft_ko, injected_terms), new_term_guard는 (en_source, draft_ko, glossary), conflict_guard는
      (draft_ko, injected_terms, conflicts). 기존 시그니처가 문자열만 받으면 선택 인자 추가로 확장하며 재구현하지 않는다. 투영을 명시하지 않은 호출은 '호출했다'로
      인정하지 않는다.
    required: true
  - name: empty_prediction_cause
    type: enum
    description: tm_search_failure | guard_rejected_in_review_queue | approval_incomplete | model_invocation_failure.
      빈 예측의 원인 분류이며 네 값 모두 보고에 건수로 따로 나온다. model_invocation_failure는 availableModelsOnBedrock.md의 가용 모델이 전부 실패한
      경우다. 어떤 원인에서도 hold_out의 ko_text나 스텁 출력을 예측으로 대체하지 않으며, 빈 예측을 준수로 세거나 분모에서 조용히 빼지 않는다.
    required: true
  - name: hitl_threshold_provenance
    type: enum
    description: measured_in_run | constant_forbidden. AC 4의 네 번째 트리거(TM 최고 유사도 임계 미만)가 쓰는 임계의 출처이며 값은 measured_in_run으로
      고정한다. 임계는 같은 실행에서 측정한 tm_confidence 분포의 상대 위치로 유도하고, 유도 규칙과 실측값을 산출물에 기록한다. hold_out의 정답 ko_text를 임계 유도에 쓰지
      않는다.
    required: true
  - name: eval_mode_hitl_policy
    type: string
    description: 평가 실행에서 HITL이 존재하는 방식. 평가 진입점은 interrupt를 우회하지 않고 실제로 발화시킨 뒤 결정론적 자동 응답자가 재개 값을 공급한다(eval_autoresume).
      자동 응답자는 hold_out의 ko_text를 열람하지 않는다. 보고는 그 산출물이 사람 승인을 거치지 않았음과 트리거 발화·자동 승인·자동 보류 건수를 명시한다. 운영 모드에서는 같은 그래프가
      실제로 정지한다.
    required: true
  - name: new_term_identity
    type: object
    description: '''초벌에 포함된 신규 용어''의 정의. new_term_guard가 EN 원문에서 찾은 용어집 미등재 EN 용어(en)와 초벌 KO가 그 용어에 사용한 역어(ko_rendering)의
      쌍이며, 출처 (카드 id, 필드)를 함께 기록한다. DraftRecord는 이 쌍을 new_terms 필드로 보유하며, injected_terms(주입된 기존 용어)와 구분된다. new_term_candidates.json에
      적재되는 것은 이 쌍이다.'
    required: true
  - name: ac_freeze_precondition
    type: object
    description: 세대 간 AC 동결의 필요조건. (a) 그 AC의 입력 스키마(특히 draft_record)가 직전 세대와 동일하고, (b) 호출부의 실재를 확인하는 재현 가능한 검증 명령이
      이번 세대에도 통과해야 한다. 두 조건 중 하나라도 불만족이면 재검증 대상이며, verification_status=assumed는 PASS의 근거가 아니다. 검증 명령은 호출부를 제거하면
      실패해야 한다.
    required: true
  - name: new_term_blocking_boundary
    description: 신규 용어 후보를 차단형과 기록형으로 가르는 경계. 차단형은 (a) 용어집 미등재 부제, (b) 룰 텍스트의 비문장초 대문자 미등재 토큰 두 가지뿐이며 이것만 interrupt를
      발화시킨다. 기록형은 나머지 전부이고 탐지 즉시 new_term_candidates.json에 적재되며 초벌 레코드에도 남지만 파이프라인을 멈추지 않는다. 마크업 태그명은 어느 쪽도 아니다.
      분류는 new_term_guard가, 차단 판정은 hitl_interrupt가 한다.
    type: enum
    allowed_values:
    - blocking_keyword
    - blocking_proper_noun
    - logged_only
    - not_a_candidate
  - name: echo_gate_contract
    type: object
    description: TM 에코 게이트의 측정 계약. 피연산자는 draft_ko와 그 레코드 자신의 tm_hits[0].ko_text이고, 분모는 tm_hits가 1건 이상이며 draft_ko가
      비어 있지 않은 레코드 전체이며 interrupted 여부와 무관하다. 비교 전에 저장소 공통의 공백 정규화를 적용한다. 임계는 max(ECHO_FLOOR, 우연일치율)이고 ECHO_FLOOR
      = 0.05(정책 하한, 상수), 우연일치율은 measured_in_run이다. 산출물에 분모 n·실측 비율·유도된 임계·실행 모드·모델 id를 기록한다. TM 히트 커버리지 하한은 두지 않는다.
    required: true
  - name: run_model_provenance
    type: object
    description: 실행이 어떤 모델로 산출됐는지의 기록. 헤더에 run_mode(real|stub), 1순위 모델 id, 실제로 시도한 모델 id 목록과 각각의 성공·실패 사유·재시도 횟수를
      남기고, 각 DraftRecord에는 그 레코드를 생성한 모델 id를 남긴다. 폴백은 availableModelsOnBedrock.md의 가용 목록 안에서만 일어나며 _StubLLM으로는 폴백하지
      않는다. 둘 이상의 모델이 쓰인 혼합 실행은 보고가 그것을 명시하고 모델별 레코드 수와 게이트 수치를 함께 낸다. run_mode가 real이 아니면 게이트 판정을 내지 않는다.
    required: true
