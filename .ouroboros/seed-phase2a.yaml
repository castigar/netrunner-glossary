goal: '[페이즈 2a/3 · 번역 검토 큐] Android: Netrunner EN→KO 번역 보조 에이전트의 2단계 온라인 경로만 구현한다. 새 카드를 룰/플레이버로 라우팅해
  TM 검색과 용어 주입으로 초벌을 생성하고, 4절 가드레일로 검증해 위반·신규용어·저신뢰 건을 interrupt()로 사람에게 넘기며, 승인 결과를 approved.jsonl에 적재하고
  네 개의 도구를 MCP 서버로 노출하는 데까지가 범위다. 1단계 자산 구축은 이미 완료되어 입력으로 주어지고, 3단계 확정 절차(GitHub Issue 동기화·Pages)와 하드
  게이트 채점은 이 페이즈의 범위가 아니다. 단일 진실 원천은 mini_pjt/SERVICE.md다.'
