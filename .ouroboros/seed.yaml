goal: 'Android: Netrunner 카드의 EN→KO 공식 번역가 팀을 위한 번역 보조 에이전트를 만든다. 과거 공식 번역물에서 용어·문형·번역메모리를
  명시적 자산으로 추출하고(1단계 오프라인 배치), 이를 근거로 새 카드의 초벌 번역을 생성한 뒤 가드레일 위반을 검출해 사람이 승인하는 카드 단위
  HITL 검토 큐를 제공하며(2단계 온라인), 용어 충돌과 신규 용어 후보를 사람이 확정하는 경로를 GitHub Pages와 GitHub Issues로
  제공한다(3단계). 번역 일관성이 개인 기량에 좌우되지 않게 하는 것이 목적이다. 단일 진실 원천은 mini_pjt/SERVICE.md다.'
task_type: code
brownfield_context:
  project_type: greenfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
- 구현 기간 2일, 이후 장기 유지보수 전제
- '원본 코퍼스는 Null Signal Games의 공개 repo https://github.com/Null-Signal-Games/netrunner-cards-json
  이며 대상 게임은 Android: Netrunner다. 팀이 소유하지 않은 공식 공개 저장소이므로 도구는 이 repo에 쓰기를 하지 않는다.'
- 검수 경로는 원본 repo가 아니라 신규 팀 소유 repo다. 그 repo에만 쓰기를 한다.
- '코퍼스 레이아웃은 v2를 사용한다. v2는 슬러그 id(예: 15_minutes), 카드당 1파일(v2/cards/*.json), 번역은 v2/translations/ko/cards/*.json
  구조이며 KO 번역 1195장이 있다. legacy pack/ 레이아웃(code 숫자 문자열, 팩당 1파일 배열)은 사용하지 않는다.'
- 룰 텍스트는 text 필드, 플레이버는 flavor 필드로 이미 분리되어 있고 기호 제거본 stripped_text가 제공되므로 기호 정규화 로직을
  새로 작성하지 않는다.
- 학습에 사용 가능한 깨끗한 코퍼스는 2012-2016 발매분 약 980장이다. EN 전체 2460장 중 KO 번역은 1257장(51%)이고, 2017년
  이후 번역은 중단됐으며 2017년 부제는 100% 영문 잔존, 한글이 전혀 없는 껍데기 레코드가 124장 있다.
- 대상 콘텐츠는 카드 룰 텍스트와 플레이버 텍스트만이다. 룰북과 UI는 범위에서 제외한다.
- 이미 공개된 카드만 취급하므로 외부 LLM 전송 제약이 없다.
- Supervisor 패턴과 Plan-Execute는 채택하지 않는다. 룰/플레이버 분기는 라우팅으로 처리하며 에이전트 분할이 아니다.
- 평가 정답셋은 별도 제작하지 않고 기존 번역물 hold-out을 사용한다.
- 충돌 용어는 사람이 확정하기 전까지 용어집에 포함하지 않는다.
- 승인만으로 용어집이 자동 갱신되지 않는다.
- 편집거리 기준선으로 무보조 사람 초벌을 사용할 수 없다. castigar/netrunner-cards-json-old 실측 결과 그 repo의
  KR 번역 956장은 전부 현재 ko의 부분집합이고 내용이 98.9-100% 동일한 최종본 스냅샷이며(text 상이 8/728건은 오타·띄어쓰기
  교정 수준), translations/kr 커밋 9건 중 8건이 upstream 메인테이너의 2016년 일괄 포맷팅이고 사용자 커밋은 2026-09-11
  단 1건이라 초벌에서 최종으로 가는 진행 이력이 존재하지 않는다.
- 공식 용어집이 부분적으로 이미 존재한다. 부제·카드타입·팩션·사이클·세트는 추출 대상이 아니므로 로드만 하며, 추출이 필요한 것은 룰 텍스트 내
  용어(install, trash, rez 등)뿐이다.
- '재사용할 기존 코드: day7_practice/final_scenario.py를 그래프 뼈대로, local_tracer.py를 트레이스 콜백으로,
  llm_judge.py와 run_eval.py를 평가 골격으로, mcp_server.py를 MCP 서버 골격으로, guards_input.py를
  가드레일 골격으로 쓴다. day5_practice의 로깅 미들웨어에서 usage_metadata는 hasattr 체크 후 접근한다.'
- '구현 이후로 미루는 것: 리랭킹, 형태소 분석기 도입, 수정 피드백의 용어집 자동 승격, 용어 개정 이력 추적, 룰북·UI 텍스트 지원, 승인
  결과의 repo 자동 반영, 승인 시 신규 용어 자동 등재.'
- '착수 전 결정이 필요한 잔여 항목: 2021-2022 번역분 142장의 코퍼스 편입 여부, 편집거리 추적 주기, 가드레일 통과율의 하드 게이트
  승격 여부.'
- '코퍼스 로컬 경로는 C:\Users\SDS\Desktop\netrunner-corpus\netrunner-cards-json 이다. 사용자 이력
  repo 스냅샷은 C:\Users\SDS\Desktop\netrunner-corpus\netrunner-cards-json-old 에 있으나 최종본
  스냅샷이므로 학습·평가에 사용하지 않는다. 경로는 설정값으로 분리하고 코드에 하드코딩하지 않는다.'
- '검수 repo는 castigar/netrunner-glossary 이며 public이고 Issues가 활성화되어 있다. 기본 브랜치는 main이고
  현재 커밋이 없는 빈 저장소다. 인증은 GITHUB_TOKEN 환경변수에서 읽는다(fine-grained PAT, admin/push 권한 확인됨).
  토큰 값을 코드·로그·커밋에 절대 기록하지 않으며, 환경변수가 없으면 즉시 실패하고 드라이런으로 조용히 넘어가지 않는다.'
- '검수 repo에는 term-conflict 와 new-term-candidate 라벨이 아직 없으므로 Issue 동기화 전에 멱등하게 생성한다.
  기존 라벨(bug, enhancement 등 GitHub 기본값)은 건드리지 않는다.'
acceptance_criteria:
- description: '하드 게이트 1: hold-out 100장 기준 용어 준수율 >= 95%. 규칙 자동 채점. 미달 시 납품 거부.'
  semantic_ac_key: ac_2ec6917b2446d6a8
- description: '하드 게이트 2: hold-out 100장 기준, 정규화 대응표 기반 게임 기호 보존율 100%. 리터럴 멀티셋 비교로
    구현하면 안 된다. [credit] [click] [subroutine] [trash] [mu] [link] [recurring-credit]
    [interrupt] 및 팩션 아이콘은 1:1 보존을 강제하고, Trace[N] ↔ <trace>추적 N</trace> 는 등가 규칙으로 등록하며,
    <strong> <em> <ul> <li> 마크업 태그는 게이트에서 제외한다. 근거: 기존 공식 KO 번역을 EN과 리터럴 비교하면 게임 기호
    13.7%, 마크업 23.0%가 불일치하고, upstream 커밋 use <trace> in Asian languages (2016-06-01)가
    이 표기 규약이 의도된 것임을 확인해 준다.'
  semantic_ac_key: ac_cc593a1acc479824
- description: '하드 게이트 3: hold-out 100장 기준, 공식 KO 번역 대비 정규화 편집거리(공백 정규화 후 1 - SequenceMatcher.ratio)
    중앙값 <= 0.25. 근거: 동일 조건에서 TM 최근접 이웃만 사용한 LLM 0회 베이스라인 중앙값이 0.359, 무작위 카드 베이스라인이
    0.791로 실측됐고 0.359의 30% 개선이 0.251이다.'
  semantic_ac_key: ac_08169c8cff978524
- description: 세 하드 게이트 중 하나라도 미달이면 불합격으로 판정한다.
  semantic_ac_key: ac_a314a0a2dfc49755
- description: 평가 집합은 깨끗한 코퍼스(2012-2016 발매, EN/KO text 존재, KO에 한글 포함) 980장에서 seed
    42로 셔플해 hold-out 100 / train 880으로 나눈다. hold-out은 자산 구축 입력에서 완전히 배제한다.
  semantic_ac_key: ac_fb9a4fc0c1ec987b
- description: 자산 구축 배치는 통계 후보 생성 단계에서 LLM을 0회 호출한다. EN n-gram과 KO 어절 n-gram의 공기빈도,
    Dice/PMI, 최소 등장 5회로만 후보를 만들고 LLM은 Pydantic 구조화 출력으로 가부 판정만 수행한다.
  semantic_ac_key: ac_775e230c574df807
- description: '자산 구축 배치는 통계 후보 생성보다 먼저 미번역 레코드 필터링 단계를 수행한다. 세 가지 미번역 표현을 모두 제외한다:
    (1) 키가 없음, (2) 키는 있고 값이 null, (3) 값은 있으나 한글이 전혀 없음. 이 전처리 없이 충돌 제외 규칙을 적용하면 부제
    용어의 54%가 용어집에서 사라진다(필터 후 15%로 감소).'
  semantic_ac_key: ac_6a0cf31a29647efb
- description: 자산 구축 배치는 v2/translations/ko/card_subtypes.json(부제 88항목), card_types.json,
    factions.json, card_cycles.json, card_sets.json을 공식 용어집으로 그대로 로드하고 추출 대상에서 제외한다.
    통계 추출은 룰 텍스트 내 용어에만 적용한다.
  semantic_ac_key: ac_8708c898b97e7a9d
- description: 용어 추출 알고리즘은 card_subtypes.json 88항목을 직접 채점 정답셋으로 사용해 정밀도·재현율을 보고한다.
  semantic_ac_key: ac_9533b4b36edc7f44
- description: 동일 EN 용어에 상이한 KO 역어가 존재하면 배치는 자동으로 정답을 고르지 않는다. 최신 발매일 채택과 최빈값 채택을
    모두 사용하지 않고, 충돌을 conflicts.json으로 분리 출력하며 해당 용어를 용어집에서 제외한다.
  semantic_ac_key: ac_a3e0dd99ba745007
- description: 3단계 확정 절차는 원본 repo와 무관한 신규 팀 소유 repo에서 백엔드 없이 동작한다. 배치가 conflicts.json과
    new_term_candidates.json을 그 repo의 GitHub Issue로 동기화한다. Issue 제목 키는 [term-conflict]
    <EN> 및 [new-term] <EN>, 라벨은 term-conflict와 new-term-candidate, 본문은 후보 역어별 체크박스와
    등장 횟수와 근거 카드 id를 포함한다.
  semantic_ac_key: ac_7461fd3c98b2b249
- description: Issue 동기화는 멱등해야 한다. 제목 키로 중복 생성을 막고, 이미 열린 Issue가 있으면 본문만 갱신하며, closed
    Issue를 다시 열지 않는다.
  semantic_ac_key: ac_98df4894130a6762
- description: GitHub Pages는 conflicts.json과 new_term_candidates.json을 fetch해 표로 렌더하고
    각 행에서 해당 Issue로 링크하는 읽기 전용 뷰다. Pages에는 쓰기 경로를 두지 않는다.
  semantic_ac_key: ac_85e28ce5e786ae0c
- description: 확정은 검수자가 Issue에서 채택할 역어 체크박스를 선택한 뒤 close하는 것으로 성립한다. 다음 배치가 closed이면서
    체크된 Issue를 읽어 glossary.json에 반영한다.
  semantic_ac_key: ac_cf187a6c1cadaa12
- description: 확정 전까지 해당 용어는 용어집에 없으므로, 2단계에서 그 용어가 나오면 HITL 트리거 신규 EN 용어 또는 용어 충돌가
    걸려 검토 큐로 간다. 확정이 밀려도 파이프라인이 멈추지 않고 잘못된 역어가 자동 전파되지도 않아야 한다.
  semantic_ac_key: ac_dc74d7aae03a56e9
- description: 용어집에 등재된 용어는 등재된 역어로만 출력하고, 위반 시 차단해 검토 큐로 보낸다.
  semantic_ac_key: ac_f8d5395065a37e95
- description: 용어집에 없는 신규 용어를 임의로 창작하지 않으며 HITL 승인을 요구한다.
  semantic_ac_key: ac_7ab0c0db695a2256
- description: 룰 텍스트에서 원문에 없는 효과·조건을 추가하거나 원문의 효과·조건을 누락하지 않는다.
  semantic_ac_key: ac_035230283ec9824a
- description: 카드 텍스트를 지시로 해석하지 않는다(프롬프트 인젝션 방어).
  semantic_ac_key: ac_a734a0a6d77a8e59
- description: 승인 또는 수정 후 승인된 결과는 원본 git repo에 쓰지 않고 approved.jsonl로만 적재한다. repo 반영과
    커밋은 사람이 별도로 수행한다.
  semantic_ac_key: ac_edf14176472464ce
- description: 승인된 번역에 용어집에 없던 신규 용어가 포함된 경우 new_term_candidates.json으로만 적재되고, 3단계
    확정 절차를 거쳐야 용어집에 등재된다. 승인만으로 다음 카드부터 강제되지 않는다.
  semantic_ac_key: ac_93f940deefd9a3ec
- description: '구현 순서를 고정한다: (1) 1단계 자산 구축 전체 (2) TM-only 베이스라인 재현해 중앙값 0.359 확인 (3)
    2단계 최소 경로 (4) 평가 (5) Docker·API (6) 3단계 확정 절차.'
  semantic_ac_key: ac_18d1132a0b3868f7
- description: '예산 초과 시 컷라인: 6번을 통째로 버리지 않고 Issue 동기화만 남긴 채 Pages 뷰를 버린다. Issue만 있어도
    확정 기능은 완결되지만, Pages만 만들고 Issue 쓰기를 빼면 확정 결과가 어디에도 남지 않아 기능이 성립하지 않는다.'
  semantic_ac_key: ac_94af66a8bc1bcc02
- description: lookup_term(en), search_tm(text), lookup_pattern(text), check_translation(en,
    ko) 네 도구를 MCP 서버로 노출한다.
  semantic_ac_key: ac_06d92f00e9fe71ea
- description: TM 검색은 BM25와 dense 임베딩을 함께 쓰는 하이브리드여야 한다. 카드 텍스트가 짧고 고유명사가 많아 exact
    match 기여가 크기 때문이다.
  semantic_ac_key: ac_e2b3780e7f9b3233
- description: 'HITL interrupt 트리거는 네 가지다: 신규 EN 용어 발견, 용어 충돌(1 EN에 2개 이상 KO), 규칙
    검증 실패, TM 최고 유사도가 임계 미만.'
  semantic_ac_key: ac_409741d9fcf857b5
- description: 관찰 지표(하드 게이트 아님)로 룰 텍스트 문형 일치 LLM-Judge >= 2.5/3, 플레이버 자연스러움 >= 2.0/3을
    측정해 보고한다.
  semantic_ac_key: ac_99a327b35174e0f8
- description: 적용 패턴은 11개이며 day8/tech_stack.md 필수 4개(1 LCEL·Pydantic, 3 RAG 하이브리드,
    11 Observability, 12 평가)를 모두 포함한다. 미채택 2개는 9 Supervisor와 10 Plan-Execute이며 사유를
    문서에 명기한다. 같은 행의 장기 메모리는 채택한다.
  semantic_ac_key: ac_d7dfc5778b2b3e7f
