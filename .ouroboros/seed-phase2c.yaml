goal: '[페이즈 2c/3 · 온라인 파이프라인 본체] Android: Netrunner EN→KO 번역 보조 에이전트의 2단계 온라인 실행 경로를 실제로 배선한다. 지금 저장소에는
  가드레일 5종·저장소·MCP 도구·게이트 채점기가 라이브러리로 존재하지만 그것들을 잇는 그래프가 없어 아무도 호출하지 않는다. 이 페이즈의 범위는 새 카드를 룰/플레이버로 라우팅해
  TM 검색과 용어집 주입으로 초벌을 생성하고, 생성된 초벌을 기존 가드레일로 검증해 위반·신규용어·저신뢰 건을 LangGraph interrupt()로 사람에게 넘기며, 승인 결과를
  approved.jsonl과 new_term_candidates.json에 적재하는 왕복을 완성하고, 그 출력을 하드 게이트 3개와 관찰 지표에 통과시켜 판정을 보고하는 진입점까지다.
  기존 모듈을 다시 만들지 않는다. 3단계 확정 절차(GitHub Issue 동기화·Pages)는 범위가 아니다. 단일 진실 원천은 mini_pjt/SERVICE.md다.'
